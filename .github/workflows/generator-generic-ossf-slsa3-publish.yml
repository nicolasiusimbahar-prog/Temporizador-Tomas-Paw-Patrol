name: SLSA generic generator
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare artifacts directory (no-op if you generate artifacts elsewhere)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # If you have a real build replace the lines below with your build steps that write files into artifacts/
          if [ -z "$(ls -A artifacts)" ]; then
            echo "No real artifacts found; creating placeholder artifact to keep workflow runnable"
            echo "placeholder" > artifacts/placeholder.txt
          fi

      - name: List artifacts (for debugging)
        run: |
          echo "Artifacts in artifacts/:"
          ls -la artifacts || true

      - name: Generate subjects (sha256) for provenance
        id: hash
        run: |
          set -euo pipefail
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found" >&2
            echo "digests=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          b64=$(python3 - <<'PY' "${files[@]}"
import sys,json,hashlib,base64,os
out=[]
for f in sys.argv[1:]:
    if not os.path.isfile(f):
        continue
    with open(f,'rb') as fh:
        h=hashlib.sha256(fh.read()).hexdigest()
    out.append({'path': f, 'sha256': h})
print(base64.b64encode(json.dumps(out).encode()).decode())
PY
)
          echo "digests=${b64}" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
